name: App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python application tests
        working-directory: app
        run: |
          python -c "from main import app; print('FastAPI application loaded successfully')"

      - name: Build Docker image
        run: |
          docker build --no-cache -t pw-observability-grafana:latest .

      - name: Check docker pip versions
        run: |
          docker run --rm pw-observability-grafana python -m pip list

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pw-observability-grafana:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Run Docker container
        run: |
          docker run -d \
            --name pw-observability-grafana \
            -p 8000:8000 \
            pw-observability-grafana:latest

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start"

          docker logs pw-observability-grafana

          exit 1

      - name: Test health endpoint
        run: |
          response=$(curl -sf http://localhost:8000/health)

          echo "$response"

          echo "$response" | grep '"status":"healthy"'

      - name: Test orders endpoint
        run: |
          response=$(curl -sf http://localhost:8000/api/orders)

          echo "$response"

          echo "$response" | grep '"orders"'

      - name: Test Prometheus metrics
        run: |
          response=$(curl -sf http://localhost:8000/metrics)

          echo "$response"

          echo "$response" | grep 'http_requests_total'

      - name: Show container status
        run: |
          docker ps

      - name: Show container logs
        if: always()
        run: |
          docker logs pw-observability-grafana