name: build-and-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI application
        working-directory: app
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > app.log 2>&1 &

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start"
          cat app/app.log
          exit 1

      - name: Test health endpoint
        run: |
          response=$(curl -sf http://localhost:8000/health)
          echo "$response"

          echo "$response" | grep '"status":"healthy"'

      - name: Test orders endpoint
        run: |
          response=$(curl -sf http://localhost:8000/api/orders)
          echo "$response"

          echo "$response" | grep '"orders"'

      - name: Test Prometheus metrics
        run: |
          response=$(curl -sf http://localhost:8000/metrics)
          echo "$response"

          echo "$response" | grep 'http_requests_total'